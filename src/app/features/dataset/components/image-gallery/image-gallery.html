<div class="gallery-container">
  
  <app-image-filter (categoryChange)="onCategoryChange($event)" />

  <app-statistics 
  [images]="images()" 
  [categories]="categories()" 
/>

 
  <div class="gallery">
    @for (img of filteredImages(); track img.id) {
      <div class="card" (click)="selectImage.emit(img.id)">
        <img
          [src]="'dataset/images/' + img.file_name"
          [alt]="img.file_name"
          loading="lazy"
        />
        <p><strong>{{ img.file_name }}</strong></p>
        <p>{{ img.annotationCount }} anotações</p>
     
      </div>
    } @empty {
      <p class="empty-state">Nenhuma imagem encontrada.</p>
    }
  </div>

  @if (datasetService.errorMessage(); as erro) {
  <div role="alert" class="p-4 rounded-lg bg-red-50 border border-red-200 text-red-700 flex items-center justify-between">
    <span>{{ erro }}</span>
    <button 
      type="button"
      (click)="datasetService.loadDefaultDataset()"
      class="px-3 py-1 bg-red-600 text-white rounded hover:bg-red-700">
      Tentar novamente
    </button>
  </div>
} @else {
  
}
</div>
